name: HoloJarvis
options:
  bundleIdPrefix: com.sinanmurad
  deploymentTarget:
    iOS: "16.0"
targets:
  HoloJarvis:
    type: application
    platform: iOS
    sources:
      - HoloJarvis
    scheme: {}
    info:
      path: HoloJarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Jarvis'i odana yerleştirmek ve ellerini görmek için kamera gerekiyor."
        NSMicrophoneUsageDescription: "Jarvis'e sesli komut vermek için mikrofon gerekiyor."
        NSSpeechRecognitionUsageDescription: "Söylediklerini anlamak için konuşma tanıma gerekiyor."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinanmurad.holojarvis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
